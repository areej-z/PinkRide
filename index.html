<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>PinkRide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Dark luxury high-tech landing page override */
        body.homepage-bg {
            background-color: #080c16 !important;
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glowing Blobs specifically for Dark Mode */
        body.homepage-bg::before {
            background: radial-gradient(circle, rgba(219, 39, 119, 0.18) 0%, rgba(251, 207, 232, 0.02) 70%, transparent 100%) !important;
        }
        body.homepage-bg::after {
            background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, rgba(103, 232, 249, 0.02) 70%, transparent 100%) !important;
        }

        .homepage-navbar {
            background: rgba(8, 12, 22, 0.9) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Center Content Styling */
        .category-badge {
            background: rgba(219, 39, 119, 0.1);
            border: 1px solid rgba(219, 39, 119, 0.3);
            color: #f472b6;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 8px 16px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 24px;
            box-shadow: 0 0 15px rgba(219, 39, 119, 0.15);
        }

        .main-headline {
            font-weight: 800 !important;
            line-height: 1.15;
            letter-spacing: -1.5px;
            font-size: clamp(2.5rem, 5vw, 4.2rem);
        }

        .highlight-glow {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #db2777 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(0, 242, 254, 0.3));
        }

        /* Glowing Center SVG Graphic with keyframe float */
        .glowing-illu-container {
            position: relative;
            z-index: 10;
        }
        .glowing-illu-wrapper {
            display: inline-block;
            animation: floatAnim 6s ease-in-out infinite;
        }
        @keyframes floatAnim {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(1deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .neon-svg {
            filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.25)) drop-shadow(0 0 30px rgba(219, 39, 119, 0.15));
        }

        /* High-tech Interactive Option Pills */
        .feature-pill {
            background: rgba(15, 22, 42, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 40px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            text-decoration: none !important;
            color: #cbd5e1 !important;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.15);
            opacity: 0; /* Animated on entrance */
        }

        .feature-pill:hover {
            transform: translateX(8px) scale(1.02);
            background: rgba(219, 39, 119, 0.06);
            border-color: rgba(219, 39, 119, 0.4);
            box-shadow: 0 0 25px rgba(219, 39, 119, 0.15), 0 0 4px rgba(219, 39, 119, 0.2);
            color: #ffffff !important;
        }

        .feature-pill-right:hover {
            transform: translateX(-8px) scale(1.02);
        }

        .pill-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .pill-icon-pink {
            background: rgba(219, 39, 119, 0.2);
            border: 1px solid rgba(219, 39, 119, 0.4);
            color: #f472b6;
        }

        .pill-icon-cyan {
            background: rgba(6, 182, 212, 0.2);
            border: 1px solid rgba(6, 182, 212, 0.4);
            color: #22d3ee;
        }

        .pill-text {
            font-weight: 600;
            font-size: 15px;
            letter-spacing: -0.2px;
        }

        /* Creative Buttons override */
        .btn-creative-primary {
            background: linear-gradient(135deg, #00f2fe 0%, #db2777 100%) !important;
            border: none !important;
            color: #ffffff !important;
            border-radius: 30px;
            padding: 14px 32px;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.25);
            transition: all 0.3s ease;
        }

        .btn-creative-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(219, 39, 119, 0.4);
        }

        .btn-creative-outline {
            background: transparent !important;
            border: 1.5px solid rgba(255, 255, 255, 0.15) !important;
            color: #e2e8f0 !important;
            border-radius: 30px;
            padding: 14px 32px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .btn-creative-outline:hover {
            border-color: #ffffff !important;
            color: #ffffff !important;
            background: rgba(255, 255, 255, 0.05) !important;
            transform: translateY(-3px);
        }

        /* Adjust columns for mobile */
        @media (max-width: 991.98px) {
            .feature-pill {
                margin-bottom: 12px;
            }
            .feature-pill:hover {
                transform: translateY(-4px) scale(1.02);
            }
        }
    </style>
</head>
<body class="homepage-bg">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark homepage-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align: middle;">
                    <circle cx="16" cy="16" r="14" stroke="url(#pinkGradient)" stroke-width="2.5" stroke-dasharray="4 2"/>
                    <circle cx="11" cy="16" r="4" fill="url(#pinkGradient)"/>
                    <circle cx="21" cy="16" r="4" fill="url(#pinkGradient)"/>
                    <path d="M11 16H21" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
                    <defs>
                        <linearGradient id="pinkGradient" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#f472b6"/>
                            <stop offset="1" stop-color="#db2777"/>
                        </linearGradient>
                    </defs>
                </svg>
                <span style="background: linear-gradient(135deg, #f472b6 0%, #db2777 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">PinkRide</span>
            </a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link btn btn-creative-outline px-4 py-2 border-0" href="login.html" style="font-size: 14px;">Connexion</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Dashboard Interactive Content -->
    <div class="container mt-5 pt-3">
        <div class="row align-items-center justify-content-center">

            <!-- CENTER MAIN HEADER & ILLUSTRATION -->
            <div class="col-lg-8 col-md-12 text-center px-lg-5 mb-4 mb-lg-0 anime-center-block mx-auto" style="opacity: 0;">
                <div class="category-badge">
                    <span>🌸</span> ECO-FRIENDLY & CONNECTED - PINKRIDE
                </div>
                
                <h1 class="main-headline text-white mb-3">
                    Votre voyage<br>commence<br>avec votre<br><span class="highlight-glow">trajet sur PinkRide.</span>
                </h1>
                
                <p class="fs-6 mx-auto mb-4" style="max-width: 500px; color: #94a3b8; font-weight: 300; line-height: 1.6;">
                    Des trajets simples & économiques — trouvez toujours votre conducteur de confiance sur PinkRide.
                </p>

                <!-- Floating Neon SVG Car/Wheel Illustration -->
                <div class="glowing-illu-container text-center mb-4">
                    <div class="glowing-illu-wrapper">
                        <svg width="150" height="150" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="neon-svg">
                            <!-- Neon Octagon -->
                            <polygon points="50,5 82,18 95,50 82,82 50,95 18,82 5,50 18,18" stroke="url(#neonCyan)" stroke-width="2.5" stroke-linejoin="round" filter="url(#glowFilter)"/>
                            <!-- Outer dashed ring -->
                            <circle cx="50" cy="50" r="32" stroke="#db2777" stroke-dasharray="4 3" stroke-width="1"/>
                            <!-- Steering Wheel / Sharing Nodes representation -->
                            <circle cx="50" cy="50" r="22" stroke="url(#neonPink)" stroke-width="2" filter="url(#glowFilter2)"/>
                            <line x1="50" y1="28" x2="50" y2="72" stroke="url(#neonPink)" stroke-width="2"/>
                            <line x1="28" y1="50" x2="72" y2="50" stroke="url(#neonPink)" stroke-width="2"/>
                            <circle cx="50" cy="50" r="6" fill="#00f2fe" filter="url(#glowFilter)"/>
                            <defs>
                                <linearGradient id="neonCyan" x1="0" y1="0" x2="100" y2="100">
                                    <stop stop-color="#00f2fe"/>
                                    <stop offset="1" stop-color="#4facfe"/>
                                </linearGradient>
                                <linearGradient id="neonPink" x1="0" y1="0" x2="100" y2="100">
                                    <stop stop-color="#f472b6"/>
                                    <stop offset="1" stop-color="#db2777"/>
                                </linearGradient>
                                <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
                                    <feGaussianBlur stdDeviation="3" result="blur"/>
                                    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                                </filter>
                                <filter id="glowFilter2" x="-20%" y="-20%" width="140%" height="140%">
                                    <feGaussianBlur stdDeviation="4" result="blur"/>
                                    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                                </filter>
                            </defs>
                        </svg>
                    </div>
                </div>

                <div class="mt-4 d-flex justify-content-center gap-3">
                    <a href="register.html" class="btn btn-creative-primary">Choisir ma route &gt;</a>
                    <a href="login.html" class="btn btn-creative-outline">Se connecter</a>
                </div>
            </div>

        </div>
    </div>

    <!-- Entrance Animations utilizing Anime.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script>
        // Central block smooth fade & upscale
        anime({
            targets: '.anime-center-block',
            translateY: [40, 0],
            scale: [0.95, 1],
            opacity: [0, 1],
            duration: 1000,
            easing: 'easeOutExpo',
            delay: 150
        });

        // Left feature pills fly in from left
        anime({
            targets: '.anime-left-pills',
            translateX: [-50, 0],
            opacity: [0, 1],
            duration: 800,
            easing: 'easeOutExpo',
            delay: anime.stagger(150, {start: 400})
        });

        // Right feature pills fly in from right
        anime({
            targets: '.anime-right-pills',
            translateX: [50, 0],
            opacity: [0, 1],
            duration: 800,
            easing: 'easeOutExpo',
            delay: anime.stagger(150, {start: 400})
        });
    </script>
</body>
</html>
